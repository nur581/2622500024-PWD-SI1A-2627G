<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu - Kopi Bangka Nuralizah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Kopi Bangka Ceria</h1>
    <p>Buku Tamu Pelanggan</p>
  </header>

  <main>
    <section class="card">
      <h2>Tinggalkan Pesan</h2>
      <form onsubmit="return kirimBukuTamu()">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="namaLengkap" placeholder="Contoh: Nur Alizah">
        </div>
        <div class="form-group">
          <label>Email Aktif</label>
          <input type="text" id="emailAktif" placeholder="Contoh: alizah@email.com">
        </div>
        <div class="form-group">
          <label>Pesan & Kesan</label>
          <textarea id="pesanTamu" placeholder="Tulis pesan kamu tentang Kopi Bangka..."></textarea>
        </div>
        <button type="submit" class="btn-kirim">Kirim Pesan</button>
        <p id="statusPesan"></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
